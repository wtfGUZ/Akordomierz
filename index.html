<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <title>Akordomierz - Real-time Guitar Chord Recognizer</title>
  </head>
  <body>
    <div class="background-animation"></div>
    <main class="app-container">
      <header>
        <h1>Akordomierz</h1>
        <p>Live Guitar Chord Recognition</p>
      </header>

      <div class="glass-panel">
        <div class="chord-display-container">
          <div id="chord-display" class="chord-display">
            <span class="placeholder">--</span>
          </div>
          <div class="visualizer-wrapper">
            <canvas id="audio-visualizer"></canvas>
          </div>
        </div>

        <div class="controls">
          <button id="start-btn" class="btn primary-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
            Start Listening
          </button>
        </div>
        <div id="status-message" class="status-message">Press start to allow microphone access</div>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
